# SPA-friendly nginx config for the Trip with uz client.
# Routes everything to /index.html so React Router handles the URL.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aggressive caching for fingerprinted asset files (Vite adds content hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static files with short cache (images, fonts in public/).
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # API proxy — Docker Compose routes /api/* to the `server` service.
    # On platforms like Vercel (where there's no upstream), these locations
    # are simply unused (client uses VITE_API_URL pointing at a separate host).
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Server also owns the SEO endpoints — proxy them too.
    location = /robots.txt  { proxy_pass http://server:5000/robots.txt; }
    location = /sitemap.xml { proxy_pass http://server:5000/sitemap.xml; }

    # SPA fallback — everything that isn't a file hits index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip compression for all text-like responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
