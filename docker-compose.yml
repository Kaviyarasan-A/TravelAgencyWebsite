# docker-compose.yml
# One-command deployment for the Trip with uz stack.
#
# Usage:
#   1. cp server/.env.example server/.env && edit values
#   2. docker compose up -d --build
#   3. Client on http://localhost, API on http://localhost:5000
#
# DB persistence:
#   Data lives in the `mongo` service backed by the `mongo_data` volume.
#   Bookings, blogs, packages, ads, users etc. survive container rebuilds.
#   For production you can point MONGODB_URI to MongoDB Atlas instead and
#   drop the local `mongo` service.

services:
  mongo:
    image: mongo:7
    container_name: tripwithuz-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tripwithuz

  server:
    build:
      context: ./server
    container_name: tripwithuz-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Override .env so the server reaches the mongo service inside the
      # docker network rather than localhost.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: tripwithuz
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tripwithuz

  client:
    build:
      context: ./client
      args:
        # In this compose setup, the client talks to the server through the
        # same host — leave blank so the client uses same-origin /api/* which
        # nginx will proxy (or set to http://server:5000 if you add a proxy).
        VITE_API_URL: ""
    container_name: tripwithuz-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - tripwithuz

volumes:
  mongo_data:

networks:
  tripwithuz:
    driver: bridge
